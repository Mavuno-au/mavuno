name: App

# The website's checks skip mobile/, but the app imports src/lib, so a change
# to either has to pass the app's own checks too.
on:
  push:
    branches: [main]
    paths: [mobile/**, src/lib/**, .github/workflows/mobile.yml]
  pull_request:
    paths: [mobile/**, src/lib/**, .github/workflows/mobile.yml]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
